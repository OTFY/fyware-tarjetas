const URL_DATA = 'https://otfy.github.io/fyware-tarjetas/hector/';
const qr = new QRCodeStyling({
  width: 2600,
  height: 2600,
  type: 'canvas',
  data: URL_DATA,
  margin: 100,
  qrOptions: { errorCorrectionLevel: 'H' },
  image: LOGO,
  imageOptions: { crossOrigin: 'anonymous', margin: 60, imageSize: 0.28, hideBackgroundDots: true },
  dotsOptions: { type: 'rounded', color: '#000000' },
  cornersSquareOptions: { type: 'extra-rounded', color: '#000000' },
  cornersDotOptions: { type: 'dot', color: '#000000' },
  backgroundOptions: { color: '#ffffff' }
});
qr.append(document.getElementById('qr'));
setTimeout(async () => {
  try {
    const pngBlob = await qr.getRawData('png');
    const svgBlob = await qr.getRawData('svg');
    window.QR_PNG = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(pngBlob); });
    window.QR_SVG = await svgBlob.text();
    const canvas = document.querySelector('canvas');
    const sc = document.createElement('canvas');
    sc.width = 650; sc.height = 650;
    sc.getContext('2d').drawImage(canvas, 0, 0, 650, 650);
    const imgData = sc.getContext('2d').getImageData(0, 0, 650, 650);
    const decoded = jsQR(imgData.data, 650, 650);
    window.QR_DECODED = decoded ? decoded.data : 'DECODE_FAILED';
    window.QR_STATUS = 'ready';
  } catch (e) { window.QR_STATUS = 'error: ' + e.message; }
}, 1500);
